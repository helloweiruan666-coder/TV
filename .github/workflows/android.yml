name: Android CI (Mobile auto-detect)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List all assemble tasks
        run: ./gradlew tasks | grep assemble

      - name: Find and run mobile debug assemble task
        id: find_task
        run: |
          TASK=$(./gradlew tasks --all | grep -o 'assemble[Mm]obile[^[:space:]]*Debug' | head -1)
          if [ -z "$TASK" ]; then
            echo "❌ Could not find any mobile debug assemble task. Available tasks:"
            ./gradlew tasks | grep assemble
            exit 1
          fi
          echo "✅ Found task: $TASK"
          echo "task_name=$TASK" >> $GITHUB_OUTPUT
          ./gradlew $TASK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: app/build/outputs/apk/**/mobile/**/debug/*.apk
          if-no-files-found: error
