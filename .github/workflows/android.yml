name: Android CI (Mobile arm64-v8a with fix)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List all assemble tasks (for debugging)
        run: ./gradlew tasks | grep assemble

      # 临时修复 ExoUtil.java 中的编译错误
      - name: Apply hotfix for MimeTypes.APPLICATION_OCTET_STREAM
        run: |
          if [ -f app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java ]; then
            sed -i 's/MimeTypes\.APPLICATION_OCTET_STREAM/"application\/octet-stream"/g' app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java
            echo "✅ Fixed ExoUtil.java"
          else
            echo "⚠️ ExoUtil.java not found, skipping fix"
          fi

      - name: Build mobile arm64-v8a debug APK
        run: ./gradlew assembleMobileArm64_v8aDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64-v8a-debug-apk
          path: app/build/outputs/apk/mobile/arm64-v8a/debug/app-mobile-arm64-v8a-debug.apk
          if-no-files-found: error
